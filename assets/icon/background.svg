  <path fill="#3a1a45" d="M0 790 L90 700 L170 610 L215 655 L262 700 L700 696 L748 712 L800 770 L860 735 L905 650 L942 640 L975 690 L1024 760 L1024 1024 L0 1024 Z"/>
