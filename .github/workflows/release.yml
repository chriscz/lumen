# Pure GitHub-native Android release pipeline (official actions/* only, pinned by SHA).
#
# Security model (two isolated GitHub Environments):
#   1. `release-bot` Environment (restricted to `main` branch ONLY):
#      Holds `RELEASE_APP_ID` and `RELEASE_APP_PRIVATE_KEY` for a dedicated
#      GitHub App added to the Bypass list of `protect-main` and
#      `protect-release-tags` rulesets (Contents: Read & write only).
#      Only runs on manual `workflow_dispatch` to prepare and tag the release.
#   2. `release` Environment (restricted to `v*.*.*` tags ONLY + required reviewer):
#      Holds the Android release signing keystore (`ANDROID_KEYSTORE_*`).
#      Only runs when a `v*.*.*` tag is pushed (either by the GitHub App above
#      or manually by the repo owner). PRs and branches can NEVER access either
#      environment or any signing secret.
#
# Two ways to cut a release:
#   1. GitHub UI (recommended): Actions -> release -> Run workflow on `main`.
#      Leave version as `auto` (or enter explicit e.g. `1.0.0`). `prepare`
#      computes the next semver and CHANGELOG.md from Conventional Commits via
#      scripts/prepare_release.sh, updates pubspec.yaml (+versionCode) and
#      Fastlane release notes, pushes the prep commit to `main` and tag `vX.Y.Z`
#      using the GitHub App token. That tag push automatically triggers the
#      `v*.*.*` build-and-sign -> publish pipeline (always created as a draft
#      GitHub Release for final review).
#   2. Local tag push: prepare locally, push PR to `main`, then push `vX.Y.Z`.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Next semantic version ('auto' from Conventional Commits, or explicit e.g. 1.0.0)"
        required: false
        default: "auto"
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  FLUTTER_SHA256: "af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-bot
    steps:
      - name: Verify release GitHub App secrets are configured
        env:
          HAS_APP_ID: ${{ secrets.RELEASE_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_APP_ID" != "true" ] || [ "$HAS_APP_KEY" != "true" ]; then
            echo "Error: missing RELEASE_APP_ID or RELEASE_APP_PRIVATE_KEY in the 'release-bot' Environment." >&2
            echo "See docs/releasing.md for GitHub App ruleset bypass setup." >&2
            exit 1
          fi

      - name: Mint short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Prepare version, auto-changelog, commit to main, and push release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW_VER="${INPUT_VERSION:-auto}"
          RAW_VER="${RAW_VER#v}"
          if [ "$RAW_VER" = "auto" ]; then
            VER="$(bash scripts/prepare_release.sh --next-version --debug)"
          else
            VER="$RAW_VER"
          fi
          TAG="v${VER}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Error: tag ${TAG} already exists." >&2
            exit 1
          fi

          bash scripts/prepare_release.sh --version "$VER" --debug

          git config user.name "Chris Coetzee"
          git config user.email "chriscz93@gmail.com"

          if [ -n "$(git status --porcelain pubspec.yaml CHANGELOG.md fastlane/)" ]; then
            git add pubspec.yaml CHANGELOG.md fastlane/
            git commit -m "chore(release): prepare ${TAG}" \
              -m "Update pubspec.yaml, CHANGELOG.md, and Fastlane release notes for ${TAG}." \
              -m "Assisted-by-AI-model: github-actions" \
              -m "Assisted-by-AI-harness: github-actions"
            git push origin HEAD:main
          fi

          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"
          echo "Pushed ${TAG}; the tag push will now trigger the build-and-sign release workflow."

  build-and-sign:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release tag matches pubspec.yaml
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          bash scripts/prepare_release.sh --check-version "$VER" --debug
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run script tests, em-dash check, and signing secret check
        run: |
          ruby scripts/check_em_dashes.rb --all
          ruby scripts/check_signing_secrets.rb --all
          for t in scripts/test_*.rb; do ruby "$t"; done
          for t in scripts/test_*.sh; do bash "$t"; done

      - name: Verify release signing secrets are configured
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" != "true" ] || [ "$HAS_STORE_PW" != "true" ] || [ "$HAS_ALIAS" != "true" ] || [ "$HAS_KEY_PW" != "true" ]; then
            echo "Error: missing one or more Android signing secrets in the 'release' GitHub Environment." >&2
            echo "Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD" >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install fresh SHA-256-verified Flutter SDK (${{ env.FLUTTER_VERSION }})
        run: |
          ARCHIVE="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          echo "${FLUTTER_SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xf "/tmp/${ARCHIVE}" -C "$HOME"
          rm -f "/tmp/${ARCHIVE}"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics
          "$HOME/flutter/bin/flutter" --version

      - name: Run Flutter analyzer and 100% coverage test suite
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          bash tool/coverage.sh

      - name: Decode release keystore into temporary file outside workspace
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="$(mktemp "${RUNNER_TEMP}/lumen-release-XXXXXX.keystore")"
          chmod 600 "$KEYSTORE_FILE"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_FILE"
          echo "path=${KEYSTORE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Build and verify signed Android APKs (split-per-ABI + universal)
        env:
          LUMEN_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash tool/package_android.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --out-dir dist \
            --debug

      - name: Remove temporary keystore file
        if: always()
        run: |
          if [ -n "${{ steps.keystore.outputs.path }}" ] && [ -f "${{ steps.keystore.outputs.path }}" ]; then
            shred -u "${{ steps.keystore.outputs.path }}" 2>/dev/null || rm -f "${{ steps.keystore.outputs.path }}"
          fi

      - name: Generate SLSA build provenance attestations for signed APKs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/lumen-v*.apk"

      - name: Extract release notes from CHANGELOG.md
        run: |
          if ! bash scripts/prepare_release.sh --extract-notes "${{ steps.meta.outputs.version }}" --out dist/release-notes.md; then
            rm -f dist/release-notes.md
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-assets
          path: dist/
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: build-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-assets
          path: dist/

      - name: Create or update draft GitHub Release and upload Android APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-and-sign.outputs.tag }}
        run: |
          NOTES_ARGS=()
          if [ -f dist/release-notes.md ]; then
            mv dist/release-notes.md /tmp/release-notes.md
            NOTES_ARGS=(--notes-file /tmp/release-notes.md)
          else
            NOTES_ARGS=(--generate-notes)
          fi

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GH_REPO" \
              --verify-tag \
              --title "$TAG" \
              --draft \
              "${NOTES_ARGS[@]}"
          fi
