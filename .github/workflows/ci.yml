# Runs static analysis, Ruby hook/release tests, signing-secret checks,
# 100% Flutter unit/E2E coverage, and an unsigned Android release APK smoke
# build on pushes to main and non-draft pull requests.
#
# Security: this workflow NEVER accesses the `release` environment or any
# Android signing secrets. PR code cannot read or leak release signing keys.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  FLUTTER_SHA256: "af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  test-and-build:
    if: ${{ github.event_name == 'push' || (!github.event.pull_request.draft && github.event.action != 'closed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check em-dashes, signing secrets, and Ruby script tests
        run: |
          ruby scripts/check_em_dashes.rb --all
          ruby scripts/check_signing_secrets.rb --all
          for t in scripts/test_*.rb; do
            echo "==> $t"
            ruby "$t"
          done

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache pinned Flutter SDK (${{ env.FLUTTER_VERSION }})
        id: flutter-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Install pinned Flutter SDK (${{ env.FLUTTER_VERSION }})
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          ARCHIVE="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          echo "${FLUTTER_SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xf "/tmp/${ARCHIVE}" -C "$HOME"
          rm -f "/tmp/${ARCHIVE}"

      - name: Configure Flutter PATH
        run: |
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics
          "$HOME/flutter/bin/flutter" --version

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Cache Gradle caches and wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'packages/*/android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Analyze and run Flutter unit and E2E tests with 100% coverage gate
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          bash tool/coverage.sh

      - name: Build unsigned Android release APK smoke check
        run: |
          bash tool/package_android.sh --unsigned --universal-only --out-dir dist --debug
